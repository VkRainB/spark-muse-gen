<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- 左侧绿色渐变 -->
        <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#118953" />
            <stop offset="100%" stop-color="#075C36" />
        </linearGradient>

        <!-- 右侧蓝紫色对角渐变 -->
        <linearGradient id="rightGrad" x1="250" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3F84F6" />
            <stop offset="100%" stop-color="#9859E6" />
        </linearGradient>

        <!-- 右侧底部火焰形状的透明镂空遮罩 -->
        <mask id="flameMask">
            <!-- 白色区域表示完全可见 -->
            <rect width="500" height="500" fill="white" />
            <!-- 黑色区域表示被抠除（透明） -->
            <path d="M 252 310 C 270 330, 280 370, 252 425 C 265 375, 260 340, 252 325 Z" fill="black" />
        </mask>
    </defs>

    <!-- ================= 左侧部分 (绿色) ================= -->
    <g fill="url(#leftGrad)">
        <!-- 1. 左侧外围六边形框架 (注意顶部和底部的交错切口) -->
        <path d="M 220 85 L 85 160 L 85 340 L 280 450 L 295 425 L 135 330 L 135 170 L 245 110 Z" />

        <!-- 2. 左半侧中心钢笔尖 -->
        <path d="M 248 110 L 205 230 L 215 275 L 248 275 L 248 228 A 12 12 0 0 1 248 204 L 248 110 Z" />

        <!-- 3. 左半侧底部画笔水滴/叶片形状 -->
        <path d="M 248 285 L 215 285 C 205 340, 215 400, 248 440 Z" />

        <!-- 4. 左侧节点网络连线 (在圆点下方绘制) -->
        <g stroke="url(#leftGrad)" stroke-width="4" stroke-linecap="round">
            <line x1="110" y1="250" x2="155" y2="185" />
            <line x1="110" y1="250" x2="155" y2="315" />
            <line x1="155" y1="185" x2="155" y2="315" />
            <line x1="155" y1="185" x2="195" y2="250" />
            <line x1="155" y1="315" x2="195" y2="250" />
            <line x1="110" y1="250" x2="195" y2="250" />
        </g>

        <!-- 5. 左侧节点网络圆点 -->
        <circle cx="110" cy="250" r="11" />
        <circle cx="155" cy="185" r="11" />
        <circle cx="155" cy="315" r="11" />
        <circle cx="195" cy="250" r="11" />
    </g>

    <!-- ================= 右侧部分 (蓝紫色渐变) ================= -->
    <g fill="url(#rightGrad)">
        <!-- 1. 右侧外围六边形框架 (注意顶部覆盖绿色，底部被绿色覆盖的交错感) -->
        <path d="M 280 415 L 415 340 L 415 160 L 220 50 L 205 75 L 365 170 L 365 330 L 255 390 Z" />

        <!-- 2. 右半侧中心钢笔尖 -->
        <path d="M 252 110 L 295 230 L 285 275 L 252 275 L 252 228 A 12 12 0 0 0 252 204 L 252 110 Z" />

        <!-- 3. 右半侧底部火焰形状 (应用了 Mask 遮罩实现镂空) -->
        <path d="M 252 285 L 285 285 C 295 340, 285 400, 252 440 Z" mask="url(#flameMask)" />

        <!-- 4. 右侧节点网络连线 -->
        <g stroke="url(#rightGrad)" stroke-width="4" stroke-linecap="round">
            <line x1="390" y1="250" x2="345" y2="185" />
            <line x1="390" y1="250" x2="345" y2="315" />
            <line x1="345" y1="185" x2="345" y2="315" />
            <line x1="345" y1="185" x2="305" y2="250" />
            <line x1="345" y1="315" x2="305" y2="250" />
            <line x1="390" y1="250" x2="305" y2="250" />
        </g>

        <!-- 5. 右侧节点网络圆点 -->
        <circle cx="390" cy="250" r="11" />
        <circle cx="345" cy="185" r="11" />
        <circle cx="345" cy="315" r="11" />
        <circle cx="305" cy="250" r="11" />
    </g>
</svg>
